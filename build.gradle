plugins {
    id 'java'
    id 'maven-publish'
}

group = 'com.usecase'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories { mavenCentral() }

dependencies {
    // Reactor BOM — el dominio solo necesita Mono/Flux, nada de Spring/HTTP.
    implementation platform('io.projectreactor:reactor-bom:2023.0.5')
    implementation 'io.projectreactor:reactor-core'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-suite'
    testRuntimeOnly  'org.junit.platform:junit-platform-launcher'

    // Reactor Test
    testImplementation 'io.projectreactor:reactor-test'

    // ArchUnit — enforcement de que este jar no adquiera dependencias de implementación
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
}

test { useJUnitPlatform() }

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        mavenLocal()
    }
}