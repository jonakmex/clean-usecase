plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.usecase'
version = '0.3.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories { mavenCentral() }

dependencies {
    // Reactor BOM — el dominio solo necesita Mono/Flux, nada de Spring/HTTP.
    // reactor-core es `api`: Mono/Flux son parte de la firma pública de
    // UseCase.execute(), cualquier consumidor los necesita en su propio
    // classpath de compilación, no solo en runtime.
    implementation platform('io.projectreactor:reactor-bom:2023.0.5')
    api 'io.projectreactor:reactor-core'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-suite'
    testRuntimeOnly  'org.junit.platform:junit-platform-launcher'

    // Reactor Test
    testImplementation 'io.projectreactor:reactor-test'

    // ArchUnit — enforcement de que este jar no adquiera dependencias de implementación
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
}

test { useJUnitPlatform() }

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        mavenLocal()

        // GitHub Packages. Sustituye a CodeArtifact, cuyo dominio 'clubix' ya
        // no existe: publicar ahi fallaba y, peor, consumirlo tambien — este
        // jar solo se resolvia desde el ~/.m2 de una maquina concreta.
        maven {
            name = 'githubPackages'
            url = 'https://maven.pkg.github.com/jonakmex/clean-usecase'
            credentials {
                username = System.getenv('GITHUB_ACTOR') ?: 'jonakmex'
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}