plugins {
    id 'java-library'
    id 'maven-publish'
    id 'me.champeau.gradle.japicmp' version '0.4.6'
}

group = 'com.usecase'
version = '0.4.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    // Published next to the jar so consumers get sources and docs in the IDE.
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()

    // Only to resolve the API baseline (a previous release of this jar).
    maven {
        url = 'https://maven.pkg.github.com/jonakmex/clean-usecase'
        credentials {
            username = System.getenv('GITHUB_ACTOR') ?: 'jonakmex'
            password = System.getenv('GITHUB_TOKEN')
        }
        content { includeGroup 'com.usecase' }
    }
}

dependencies {
    // Reactor BOM — the domain only needs Mono/Flux, no Spring/HTTP.
    // reactor-core is `api`: Mono/Flux are part of UseCase.execute()'s public
    // signature, so every consumer needs them on its own compile classpath,
    // not just at runtime. The BOM is `api` too: as `implementation` it only
    // shipped in runtimeElements, and a Gradle consumer without its own BOM
    // got a version-less reactor-core at compile time.
    api platform('io.projectreactor:reactor-bom:2025.0.8')
    api 'io.projectreactor:reactor-core'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-suite'
    testRuntimeOnly  'org.junit.platform:junit-platform-launcher'

    // Reactor Test
    testImplementation 'io.projectreactor:reactor-test'

    // ArchUnit — enforces that this jar never picks up implementation dependencies
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'
}

test { useJUnitPlatform() }

// Records and one-line contracts don't need a Javadoc comment each; keep
// the rest of doclint (broken HTML, bad references) on.
javadoc { options.addBooleanOption('Xdoclint:all,-missing', true) }

// API compatibility against the last release (`apiBaseline` in
// gradle.properties). Binary-incompatible changes fail the check while the
// version keeps the baseline's major.minor; bumping the minor (pre-1.0
// SemVer) is the explicit way to allow them. Skipped until a baseline exists.
def apiBaseline = providers.gradleProperty('apiBaseline').orNull
def majorMinor = { String v -> v.tokenize('.-').take(2) }

tasks.register('apiCheck', me.champeau.gradle.japicmp.JapicmpTask) {
    group = 'verification'
    description = "Checks binary compatibility against release ${apiBaseline ?: '(none yet)'}"
    onlyIf('apiBaseline is set') { apiBaseline != null }
    if (apiBaseline) {
        // Detached, so the baseline jar stays off every other classpath.
        def baseline = configurations.detachedConfiguration(
                dependencies.create("com.usecase:clean-usecase:${apiBaseline}@jar"))
        oldClasspath.from(baseline)
        def sameMinor = majorMinor(version.toString()) == majorMinor(apiBaseline)
        failOnModification = sameMinor
        failOnSourceIncompatibility = sameMinor
    }
    newClasspath.from(tasks.named('jar'))
    onlyBinaryIncompatibleModified = true
    txtOutputFile = layout.buildDirectory.file('reports/apiCheck.txt')
}

// CI has a GITHUB_TOKEN to fetch the baseline; locally run `./gradlew apiCheck`
// with GITHUB_TOKEN set to a PAT that has read:packages.
if (System.getenv('CI')) {
    tasks.named('check') { dependsOn 'apiCheck' }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        mavenLocal()

        // GitHub Packages. Replaces CodeArtifact, whose 'clubix' domain no
        // longer exists: publishing there failed and, worse, so did consuming
        // it — this jar only resolved from one specific machine's ~/.m2.
        maven {
            name = 'githubPackages'
            url = 'https://maven.pkg.github.com/jonakmex/clean-usecase'
            credentials {
                username = System.getenv('GITHUB_ACTOR') ?: 'jonakmex'
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}